            ${["P0", "P1", "P2", "P3"].map((s) => `<option value="${s}" ${(t.severity || "P1") === s ? "selected" : ""}>Sev ${s}</option>`).join("")}
          </select>`
        : "";
      const ownerSel = `
        <select class="inline-select" data-patch-field="owner" data-task="${esc(t.task_id)}" title="归属">
          <option value="me" ${t.owner === "me" ? "selected" : ""}>owner: me</option>
          <option value="team" ${t.owner === "team" ? "selected" : ""}>owner: team</option>
        </select>`;
      const bucketSel = t.phase === "backlog"
        ? `<select class="inline-select" data-patch-field="bucket" data-task="${esc(t.task_id)}" title="Backlog 分区">
            <option value="must" ${(t.bucket || "must") === "must" ? "selected" : ""}>明确要做</option>
            <option value="maybe" ${t.bucket === "maybe" ? "selected" : ""}>可能亲自做</option>
            <option value="team" ${t.bucket === "team" ? "selected" : ""}>团队想法</option>
          </select>`
        : "";
      const phaseSel = `
        <select class="inline-select" data-patch-field="phase" data-task="${esc(t.task_id)}" title="阶段">
          ${["backlog", "intake", "in_progress", "in_review", "blocked", "needs_human", "merged_pending_release"].map((ph) => `<option value="${ph}" ${t.phase === ph ? "selected" : ""}>${ph}</option>`).join("")}
        </select>`;

      const depsHtml = (t.resolved_deps || []).map((d) =>
        `<button class="dep-chip ${d.satisfied ? "done" : "locked"}" data-jump-task="${esc(d.task_id)}" title="前置依赖 (${esc(d.phase)}): ${esc(d.title)}">${d.satisfied ? "✓" : "🔒"} ${esc(d.task_id)}</button>`
      ).join("");

      metaEl.innerHTML = `${priSel}${sevSel}${ownerSel}${bucketSel}${phaseSel}${depsHtml}<button class="ghost xs" data-edit-deps="${esc(t.task_id)}">+ 依赖</button>`;

      // Build context-adaptive middle panels
      const sections = [];

      if (t.phase === "needs_human") {
        sections.push(`
          <div class="panel" style="border-color:var(--sig-amber-border);background:linear-gradient(180deg, var(--sig-amber-bg), var(--bg-card))">
            <div class="panel-head"><h4 class="panel-title">HUMAN DECISION</h4><span class="dot warn"></span></div>
            ${renderDecisionButtons(t, true)}
          </div>`);
      }

      if (t.kind === "release") {
        const inc = t.included_tasks || [];
        const incHtml = inc.length === 0
          ? `<div class="eyebrow">暂无待发版 PR (merged_pending_release)</div>`
          : inc.map((it) => {
              const prLinks = (it.prs || []).map((p) =>
                `<a class="badge link" href="${esc(safeUrl(p.url))}" target="_blank" rel="noreferrer">#${esc(p.number || "?")} ↗</a>`
              ).join("");
              return `
                <div class="rel-pr-row">
                  <div class="rel-pr-main">
                    ${it.has_migration ? `<span class="micro db">DB</span>` : ""}
                    <span class="rel-pr-title" data-jump-task="${esc(it.task_id)}">${esc(it.title)}</span>
                  </div>
                  <div class="badges" style="flex-shrink:0">${prLinks || `<span class="badge">${esc(it.priority)}</span>`}</div>
                </div>`;
            }).join("");

        const cl = t.checklist || [];
        const clHtml = cl.length === 0
          ? `<div class="eyebrow">无检查项</div>`
          : cl.map((item, idx) => `
              <label class="check-row ${item.done ? "done" : ""}">
                <input type="checkbox" data-toggle-check="${idx}" data-task="${esc(t.task_id)}" ${item.done ? "checked" : ""} />
                <span>${esc(item.label)}</span>
              </label>`).join("");

        sections.push(`
          <div class="panel">
            <div class="panel-head">
              <h4 class="panel-title">INCLUDED PRS · MERGED PENDING RELEASE</h4>
              <span class="section-count">${esc(inc.length)} tasks · ${esc(t.included_pr_count || 0)} PRs${t.migration_count ? ` · ${t.migration_count} DB` : ""}</span>
            </div>
            ${incHtml}
          </div>
          <div class="panel">
            <div class="panel-head">
              <h4 class="panel-title">RELEASE CHECKLIST</h4>
              <span class="section-count">${esc(t.checklist_done)}/${esc(t.checklist_total)}</span>
            </div>
            <div>${clHtml}</div>
            <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border-subtle);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
              <span class="eyebrow">仅在 Prod 升级验证完成后执行</span>
              <button class="primary sm" data-complete-release="${esc(t.task_id)}">确认已发 Prod 并批量归档 (${esc(inc.length)})</button>
            </div>
          </div>`);
      } else {
        // Backlog or Bug quick strip
        if (t.phase === "backlog") {
          sections.push(`
            <div class="panel">
              <div class="panel-head"><h4 class="panel-title">BACKLOG ACTIONS</h4></div>
              ${t.next_step ? `<div class="drawer-next">${esc(t.next_step)}</div>` : ""}
              <div class="badges">
                <button class="primary sm" data-quick-start="${esc(t.task_id)}">立项开工 → Now</button>
                <button class="sm" data-quick-start-investigate="${esc(t.task_id)}">先做只读调研</button>
                <button class="ghost sm" data-edit-note="${esc(t.task_id)}">编辑说明</button>
              </div>
            </div>`);
        } else {
          const bugStrip = t.kind === "bug" && t.phase !== "merged_pending_release"
            ? `<div class="badges" style="margin-bottom:10px">
                 <button class="sm" data-bug-triage="investigate" data-task="${esc(t.task_id)}">派只读排查</button>
                 <button class="primary sm" data-bug-triage="fix" data-task="${esc(t.task_id)}">派修 Bug</button>
                 <button class="ghost sm" data-quick-owner="${esc(t.task_id)}">${t.owner === "team" ? "转回我处理" : "交团队处理"}</button>
               </div>`
            : "";

          const gates = t.gates || {};
          const revSat = Boolean(gates.independent_review_pass?.satisfied);
          const mergeApp = Boolean(gates.merge_authorization?.approved);
          const deployPol = gates.deploy_authorization?.policy || "forbidden";

          const allThreads = [];
          if (t.threads?.implementer) allThreads.push({ label: "Impl", ...t.threads.implementer });
          (t.threads?.reviewers || []).forEach((r, i) => allThreads.push({ label: `Rev R${i + 1}`, ...r }));
          (t.threads?.investigators || []).forEach((r, i) => allThreads.push({ label: `Inv #${i + 1}`, ...r }));
          if (t.threads?.merger) allThreads.push({ label: "Merger", ...t.threads.merger });

          const threadChips = allThreads.length > 0
            ? `<div class="badges" style="margin-top:9px">${allThreads.map((th) =>
                th.t3_link
                  ? `<a class="thread-chip" href="${esc(safeUrl(th.t3_link))}">${esc(th.label)}${th.model ? " · " + esc(th.model) : ""} ↗</a>`
                  : `<span class="thread-chip">${esc(th.label)}</span>`
              ).join("")}</div>`
            : "";

          sections.push(`
            <div class="panel">
              <div class="panel-head">
                <h4 class="panel-title">SUMMARY & GATES</h4>
                <button class="ghost xs" data-edit-note="${esc(t.task_id)}">编辑</button>
              </div>
              ${bugStrip}
              <div class="drawer-next">${esc(t.next_step || "-")}</div>
              <div class="gate-grid">
                <div class="gate-cell">
                  <span class="eyebrow">REVIEW GATE</span>
                  <span class="gate-val"><span class="dot ${revSat ? "live" : "warn"}"></span><span>${revSat ? "PASS @" + esc(shortSha(gates.independent_review_pass?.verified_head_sha)) : "PENDING"}</span></span>
                </div>
                <div class="gate-cell">
                  <span class="eyebrow">MERGE POLICY</span>
                  <span class="gate-val"><span class="dot ${mergeApp ? "live" : ""}"></span><span>${esc(gates.merge_authorization?.policy || "-")}${mergeApp ? " · OK" : ""}</span></span>
                </div>
                <div class="gate-cell">
                  <span class="eyebrow">DEPLOY</span>
                  <span class="gate-val"><span class="dot"></span><span>${esc(deployPol)}</span></span>
                </div>
              </div>
              ${threadChips}
            </div>`);
        }

        // Structured Receipts & Open Risks (compact)
        const receipts = t.receipts || [];
        if (receipts.length > 0) {
          if (state.selectedReceiptIdx >= receipts.length) state.selectedReceiptIdx = 0;
          const cur = receipts[state.selectedReceiptIdx];
          const findings = Array.isArray(cur.findings) ? cur.findings : [];
          const risks = Array.isArray(cur.open_risks) ? cur.open_risks : [];
          const tabs = receipts.map((r, idx) =>
            `<button class="receipt-tab ${idx === state.selectedReceiptIdx ? "active" : ""}" data-receipt-idx="${idx}">${esc(r.step_id)} · ${esc(r.role)}</button>`
          ).join("");

          const findingsHtml = findings.length === 0
            ? `<div class="eyebrow">0 FINDINGS</div>`
            : findings.map((f) => {
                const sevCls = f.severity === "blocker" ? "blocker" : f.severity === "major" ? "changes" : "";
                const rowSev = f.severity === "blocker" ? "sev-blocker" : f.severity === "major" ? "sev-major" : "";
                const stCls = f.status === "resolved" ? "pass" : sevCls;
                return `
                  <div class="finding-row ${rowSev}">
                    <div class="badges">
                      <span class="badge ${sevCls}">${esc(f.id)} · ${esc(f.severity)}</span>
                      <span class="badge ${stCls}">${esc(f.status)}</span>
                      ${f.location ? `<span class="time" style="white-space:normal;word-break:break-all">${esc(f.location)}</span>` : ""}
                    </div>
                    <div class="finding-summary">${esc(f.summary)}</div>
                    ${f.repro_or_evidence ? `<div class="finding-evidence">${esc(f.repro_or_evidence)}</div>` : ""}
                  </div>`;
              }).join("");

          const risksHtml = risks.length === 0
            ? ""
            : `<div class="sub-heading"><span>Open Risks</span><span>${esc(risks.length)}</span></div>` +
              risks.map((r) => `<div class="risk-row">${esc(typeof r === "string" ? r : (r?.summary || r?.description || JSON.stringify(r)))}</div>`).join("");

          sections.push(`
            <div class="panel">
              <div class="panel-head">
                <h4 class="panel-title">RECEIPTS & OPEN RISKS</h4>
                <span class="section-count">${esc(cur.status)} · ${esc(cur.checks_pass)}/${esc(cur.checks_total)} checks</span>
              </div>
              <div class="receipt-tabs">${tabs}</div>
              ${cur.next_recommendation ? `<div class="drawer-next">${esc(cur.next_recommendation)}</div>` : ""}
              <div class="sub-heading"><span>Findings</span><span>${esc(findings.length)}</span></div>
              ${findingsHtml}
              ${risksHtml}
            </div>`);
        }
      }

      // Unified Vercel Board Thread Timeline
      const threadItems = t.thread || [];
      const threadHtml = threadItems.length === 0
        ? `<div class="eyebrow">NO THREAD ACTIVITY YET</div>`
        : `<div class="thread-stream">${threadItems.map((m) => {
            const actorCls = m.actor === "you" ? "you" : ["neon", "astra", "sol", "opus"].includes(m.actor) ? "model" : "";
            const msgCls =
              m.kind === "steer" ? "kind-steer" :
              m.kind === "comment" ? "kind-comment" :
              m.kind === "receipt" ? (m.status === "pass" ? "kind-receipt-pass" : "kind-receipt-changes") :
              m.kind === "phase" ? "kind-phase" : "";
            return `
              <div class="thread-msg ${msgCls}">
                <div class="thread-msg-head">
                  <div class="thread-actor-wrap">
                    <span class="actor-pill ${actorCls}">${esc(m.actor || "system")}</span>
                    <span class="thread-msg-title">${esc(m.title)}</span>
                  </div>
                  <span class="time" title="${esc(fmtTime(m.ts))}">${esc(fmtTime(m.ts, true))}</span>
                </div>
                ${m.body ? `<div class="thread-msg-body">${esc(m.body)}</div>` : ""}
              </div>`;
          }).join("")}</div>`;

      sections.push(`
        <div class="panel">
          <div class="panel-head">
            <h4 class="panel-title">THREAD</h4>
            <span class="section-count">${esc(threadItems.length)}</span>
          </div>
          ${threadHtml}
        </div>`);

      bodyEl.innerHTML = sections.join("");
      bodyEl.scrollTop = prevScroll;
    }

    function render() {
      const snap = state.snapshot;
      if (!snap) return;

      updateStatusBadge();

      // Project filter options
      const projSel = document.getElementById("project-filter");
      const projSlugs = getProjectSlugs();
      projSel.innerHTML =
        `<option value="">全部</option>` +
        projSlugs.map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
      projSel.value = state.project;

      // 5-Channel tabs with subtle dot alerts
      const c = snap.counts || {};
      const nowDot = (c.p0_bugs ?? 0) > 0 ? "danger" : (c.needs_human ?? 0) > 0 ? "warn" : "";
      const bugsDot = (c.p0_bugs ?? 0) > 0 ? "danger" : "";
      const tabMeta = {
        now: { label: "Now", count: c.now ?? 0, dot: nowDot },
        bugs: { label: "Bugs", count: c.bugs ?? 0, dot: bugsDot },
        backlog: { label: "Backlog", count: c.backlog ?? 0, dot: "" },
        releases: { label: "Releases", count: c.releases ?? 0, dot: "" },
        archive: { label: "Archive", count: c.archive ?? 0, dot: "" },
      };
      document.querySelectorAll("#view-tabs .tab").forEach((b) => {
        const v = b.dataset.view;
        const m = tabMeta[v] || { label: v, count: 0, dot: "" };
        b.classList.toggle("active", v === state.view);
        b.innerHTML =
          `${m.dot ? `<span class="dot ${m.dot}"></span>` : ""}` +
          `<span>${esc(m.label)}</span>` +
          `<span class="tab-count">${esc(m.count)}</span>`;
      });

      const filtered = filterTasks(snap.active_tasks || []);
      const root = document.getElementById("app-content");

      if (state.view === "now") {
        const nowAll = filtered.filter(isNowTask);
        const used = new Set();
        const take = (fn) => {
          const arr = nowAll.filter((t) => !used.has(t.task_id) && fn(t));
          arr.forEach((t) => used.add(t.task_id));
          return arr;
        };
        const nh = take((t) => t.phase === "needs_human");
        const p0Bugs = take((t) => t.kind === "bug" && (t.severity === "P0" || t.priority === "P0"));
        const inProg = take((t) => t.phase === "in_progress");
        const inRev = take((t) => t.phase === "in_review");
        const blocked = take((t) => t.phase === "blocked");
        const intake = take((t) => t.phase === "intake");
        const other = take(() => true);

        const parts = [];
        if (nh.length > 0) parts.push(renderSection("NEEDS HUMAN", nh, { tone: "amber" }));
        if (p0Bugs.length > 0) parts.push(renderSection("P0 BUGS", p0Bugs, { mode: "bug", tone: "red" }));
        if (inProg.length > 0) parts.push(renderSection("IN PROGRESS", inProg));
        if (inRev.length > 0) parts.push(renderSection("IN REVIEW", inRev));
        if (blocked.length > 0) parts.push(renderSection("BLOCKED", blocked));
        if (intake.length > 0) parts.push(renderSection("INTAKE", intake));
        if (other.length > 0) parts.push(renderSection("OTHER", other));

        root.innerHTML = parts.length > 0 ? parts.join("") : `<div class="empty">NOW 频道清空 — 可从 Backlog 立项或通过「+ 新建」录入任务</div>`;
      } else if (state.view === "bugs") {
        const sevRank = { P0: 0, P1: 1, P2: 2, P3: 3 };
        const bugs = filtered
          .filter((t) => t.kind === "bug")
          .sort((a, b) => (sevRank[a.severity] ?? 9) - (sevRank[b.severity] ?? 9));
        const myBugs = bugs.filter((b) => b.owner !== "team");
        const teamBugs = bugs.filter((b) => b.owner === "team");
        const parts = [];
        if (myBugs.length > 0) parts.push(renderSection("MY BUGS · 待我处理", myBugs, { mode: "bug", tone: myBugs.some((b) => b.severity === "P0") ? "red" : "" }));
        if (teamBugs.length > 0) parts.push(renderSection("TEAM BUGS · 已交团队", teamBugs, { mode: "bug" }));
        root.innerHTML = parts.length > 0 ? parts.join("") : `<div class="empty">暂无活跃 Bug — 点击右上角「+ 新建 → 记一个 Bug」10 秒快录</div>`;
      } else if (state.view === "backlog") {
        const priRank = { P0: 0, P1: 1, P2: 2, "-": 3 };
        const sortBl = (arr) => arr.sort((a, b) => (priRank[a.priority] ?? 9) - (priRank[b.priority] ?? 9));
        const bl = filtered.filter((t) => t.phase === "backlog");
        const must = sortBl(bl.filter((t) => (t.bucket || "must") === "must"));
        const maybe = sortBl(bl.filter((t) => t.bucket === "maybe"));
        const team = sortBl(bl.filter((t) => t.bucket === "team"));
        root.innerHTML = [
          renderSection("明确要做 · MUST", must, { mode: "backlog" }),
          renderSection("可能亲自做 · MAYBE", maybe, { mode: "backlog" }),
          renderSection("团队想法 · TEAM", team, { mode: "backlog" }),
        ].join("");
      } else if (state.view === "releases") {
        const rels = filtered.filter((t) => t.kind === "release");
        const merged = filtered.filter((t) => t.phase === "merged_pending_release" && t.kind !== "release");
        const parts = [];
        parts.push(
          rels.length > 0
            ? renderSection("RELEASE TRAINS · 发版车次", rels, { mode: "release" })
            : `<div class="empty" style="margin-bottom:16px">暂无活跃发版车次 — 点击「+ 新建 → 建发版车次」</div>`
        );
        if (merged.length > 0) {
          parts.push(renderSection("MERGED PENDING RELEASE · 待发版合入清单", merged, {
            collapsible: true,
            collapsed: state.mergedCollapsed,
            toggleId: "merged",
          }));
        }
        root.innerHTML = parts.join("");
      } else {
        root.innerHTML = renderArchiveChannel(snap);
      }

      renderDrawer();
    }

    function openCreateModal(kind) {
      closeCreateMenu();
      const defaultProj = state.project || getProjectSlugs()[0] || "example";

      if (kind === "new_feature") {
        openModal(
          "新需求 / Backlog",
          `${getProjectOptionsDatalist()}
           <div class="field-row-3">
             <div class="field"><label>项目</label><input class="input" id="m-proj" list="zstack-proj-list" value="${esc(defaultProj)}" /></div>
             <div class="field"><label>优先级</label><select class="input" id="m-pri"><option>P0</option><option selected>P1</option><option>P2</option></select></div>
             <div class="field"><label>去向</label><select class="input" id="m-dest"><option value="backlog:must">Backlog · 明确要做</option><option value="backlog:maybe">Backlog · 可能亲自做</option><option value="backlog:team">Backlog · 团队想法</option><option value="now:implement">立即立项开工</option><option value="now:investigate">立即只读调研</option></select></div>
           </div>
           <div class="field"><label>标题</label><input class="input" id="m-title" placeholder="简洁明确的功能标题" /></div>
           <div class="field"><label>说明 / 约束（可选）</label><textarea class="input" id="m-note" placeholder="目标、范围、前置条件或验收标准..."></textarea></div>`,
          async () => {
            const title = document.getElementById("m-title").value.trim();
            if (!title) { showToast("请填写标题", "", "warn"); return; }
            const dest = document.getElementById("m-dest").value;
            const [destKind, destSub] = dest.split(":");
            const isBacklog = destKind === "backlog";
            const res = await apiRequest("POST", "/api/items", {
              kind: "feature",
              project_slug: document.getElementById("m-proj").value.trim() || defaultProj,
              priority: document.getElementById("m-pri").value,
              phase: isBacklog ? "backlog" : "intake",
              bucket: isBacklog ? destSub : undefined,
              owner: isBacklog && destSub === "team" ? "team" : "me",
              title,
              note: document.getElementById("m-note").value.trim(),
              dispatch_mode: isBacklog ? "none" : destSub,
            });
            reportWebhookResult(res, isBacklog ? "已加入活 Backlog" : "已立项进入 Now");
            state.view = isBacklog ? "backlog" : "now";
            closeModal();
            await refreshSnapshot();
          },
          "创建"
        );
      } else if (kind === "new_bug") {
        openModal(
          "10 秒快录 Bug",
          `${getProjectOptionsDatalist()}
           <div class="field-row-3">
             <div class="field"><label>项目</label><input class="input" id="m-proj" list="zstack-proj-list" value="${esc(defaultProj)}" /></div>
             <div class="field"><label>严重度</label><select class="input" id="m-sev"><option value="P0">P0 · 阻断</option><option value="P1" selected>P1 · 严重</option><option value="P2">P2 · 一般</option><option value="P3">P3 · 轻微</option></select></div>
             <div class="field"><label>归属</label><select class="input" id="m-owner"><option value="me" selected>我处理 (me)</option><option value="team">交团队 (team)</option></select></div>
           </div>
           <div class="field-row">
             <div class="field"><label>来源</label><select class="input" id="m-source"><option value="developer">developer</option><option value="slack">slack</option><option value="prod-alert">prod-alert</option><option value="manual">manual</option></select></div>
             <div class="field"><label>立即动作</label><select class="input" id="m-dispatch"><option value="none" selected>仅入池 (intake)</option><option value="investigate">立即派只读排查</option><option value="fix">立即派修 (Implementer)</option></select></div>
           </div>
           <div class="field"><label>Bug 标题</label><input class="input" id="m-title" placeholder="例如：SSO 回调在多子域下偶发 401" /></div>
           <div class="field"><label>复现线索 / Trace / 报错详情（可选）</label><textarea class="input" id="m-note" placeholder="粘贴错误摘要、租户/环境线索、复现步骤..."></textarea></div>`,
          async () => {
            const title = document.getElementById("m-title").value.trim();
            if (!title) { showToast("请填写 Bug 标题", "", "warn"); return; }
            const dispatchMode = document.getElementById("m-dispatch").value;
            const res = await apiRequest("POST", "/api/items", {
              kind: "bug",
              project_slug: document.getElementById("m-proj").value.trim() || defaultProj,
              severity: document.getElementById("m-sev").value,
              owner: document.getElementById("m-owner").value,
              source: document.getElementById("m-source").value,
              title,
              note: document.getElementById("m-note").value.trim(),
              dispatch_mode: dispatchMode,
            });
            reportWebhookResult(res, "Bug 已录入");
            state.view = "bugs";
            closeModal();
            await refreshSnapshot();
          },
          "录入 Bug"
        );
      } else if (kind === "new_release") {
        openModal(
          "新建发版车次",
          `${getProjectOptionsDatalist()}
           <div class="field-row">
             <div class="field"><label>项目</label><input class="input" id="m-proj" list="zstack-proj-list" value="${esc(defaultProj)}" /></div>
             <div class="field"><label>优先级</label><select class="input" id="m-pri"><option>P0</option><option selected>P1</option><option>P2</option></select></div>
           </div>
           <div class="field"><label>车次标题</label><input class="input" id="m-title" placeholder="例如：v1.0.0 发版车次" /></div>
           <div class="field"><label>发版备注（可选）</label><textarea class="input" id="m-note" placeholder="将自动汇总该项目所有 merged_pending_release 任务并生成标准发版检查清单..."></textarea></div>`,
          async () => {
            const title = document.getElementById("m-title").value.trim();
            if (!title) { showToast("请填写发版车次标题", "", "warn"); return; }
            await apiRequest("POST", "/api/items", {
              kind: "release",
              project_slug: document.getElementById("m-proj").value.trim() || defaultProj,
              priority: document.getElementById("m-pri").value,
              phase: "intake",
              title,
              note: document.getElementById("m-note").value.trim(),
              dispatch_mode: "none",
            });
            showToast("发版车次已创建", title, "ok");
            state.view = "releases";
            closeModal();
            await refreshSnapshot();
          },
          "创建车次"
        );
      } else if (kind === "review_pr") {
        openModal(
          "审外部 PR（固定 SHA 独立复审）",
          `<div class="field"><label>PR 编号或完整 URL</label><input class="input" id="m-pr" placeholder="例如：123 或 https://github.com/owner/repo/pull/123" /></div>
           <div class="field"><label>重点关注点（可选）</label><textarea class="input" id="m-note" placeholder="例如：重点检查 PG17 唯一索引与并发安全..."></textarea></div>`,
          async () => {
            const raw = document.getElementById("m-pr").value.trim();
            if (!raw) { showToast("请输入 PR 编号或 URL", "", "warn"); return; }
            const isNum = /^\d+$/.test(raw);
            const canonicalRepo = state.snapshot?.projects?.find((p) => p.slug === defaultProj)?.canonical_repo || "";
            const repo = canonicalRepo.match(/^(?:https:\/\/)?github\.com\/([\w.-]+\/[\w.-]+?)(?:\.git)?\/?$/i)?.[1];
            if (isNum && !repo) { showToast("请提供完整 PR URL", "", "warn"); return; }
            await triggerAction({
              kind: "review_pr",
              project_slug: defaultProj,
              pr_number: isNum ? Number(raw) : null,
              pr_url: isNum ? `https://github.com/${repo}/pull/${raw}` : raw,
              note: document.getElementById("m-note").value.trim(),
            });
            closeModal();
          },
          "派发复审"
        );
      }
    }

    // Create dropdown toggle
    document.getElementById("btn-create-menu").addEventListener("click", (e) => {
      e.stopPropagation();
      const dd = document.getElementById("create-dropdown");
      const willOpen = !dd.classList.contains("open");
      dd.classList.toggle("open", willOpen);
      e.currentTarget.setAttribute("aria-expanded", String(willOpen));
    });

    // Inline drawer select changes (priority / severity / owner / bucket / phase)
    document.addEventListener("change", async (e) => {
      const sel = e.target.closest("[data-patch-field]");
      if (sel) {
        const field = sel.dataset.patchField;
        const taskId = sel.dataset.task;
        await patchTask(taskId, { [field]: sel.value }, `已更新 ${field}`);
        return;
      }

      const chk = e.target.closest("[data-toggle-check]");
      if (chk) {
        const taskId = chk.dataset.task;
        const idx = Number(chk.dataset.toggleCheck);
        const t = state.snapshot?.active_tasks?.find((x) => x.task_id === taskId);
        if (!t || !Array.isArray(t.checklist)) return;
        const nextList = t.checklist.map((item, i) => i === idx ? { ...item, done: chk.checked } : item);
        await patchTask(taskId, { checklist: nextList });
        return;
      }
    });

    // Delegated UI click interactions
    document.addEventListener("click", async (e) => {
      if (!e.target.closest("#create-dropdown")) closeCreateMenu();

      const createAct = e.target.closest("[data-create-action]");
      if (createAct) { openCreateModal(createAct.dataset.createAction); return; }

      const tab = e.target.closest("#view-tabs .tab");
      if (tab) { state.view = tab.dataset.view; render(); return; }

      const archSub = e.target.closest("[data-archive-sub]");
      if (archSub) { state.archiveSub = archSub.dataset.archiveSub; render(); return; }

      const tog = e.target.closest("[data-toggle]");
      if (tog && tog.dataset.toggle === "merged") { state.mergedCollapsed = !state.mergedCollapsed; render(); return; }

      const recTab = e.target.closest("[data-receipt-idx]");
      if (recTab) { state.selectedReceiptIdx = Number(recTab.dataset.receiptIdx); renderDrawer(); return; }

      const copyBtn = e.target.closest("[data-copy-cmd]");
      if (copyBtn) { copyToClipboard(copyBtn.dataset.copyCmd); return; }

      // Jump to dependency or release included task
      const jumpBtn = e.target.closest("[data-jump-task]");
      if (jumpBtn) {
        e.stopPropagation();
        const tid = jumpBtn.dataset.jumpTask;
        const exists = state.snapshot?.active_tasks?.some((x) => x.task_id === tid);
        if (exists) {
          state.selectedTaskId = tid;
          state.selectedReceiptIdx = 0;
          render();
        } else {
          showToast("该前置任务已归档或不在活跃列表", tid, "warn");
        }
        return;
      }

      // Quick start backlog item -> instant phase=intake + Webhook dispatch -> moves into Now immediately!
      const startBtn = e.target.closest("[data-quick-start], [data-quick-start-investigate]");
      if (startBtn) {
        e.stopPropagation();
        const isInv = Boolean(startBtn.dataset.quickStartInvestigate);
        const taskId = startBtn.dataset.quickStart || startBtn.dataset.quickStartInvestigate;
        const t = state.snapshot?.active_tasks?.find((x) => x.task_id === taskId);
        if (!t) return;
        openModal(
          `${isInv ? "只读调研" : "立项开工"} · ${t.title}`,
          `<div class="field">
             <label>说明</label>
             <div style="font-size:12px;color:var(--fg-secondary);line-height:1.5">将立即把 <span class="mono">${esc(taskId)}</span> 从 Backlog 移入 <span class="mono">Now (intake)</span>，刷新 <span class="mono">BACKLOG.md / BOARD.md</span> 并通过 Webhook 唤醒 Orchestrator。</div>
           </div>
           <div class="field">
             <label>范围说明 / 约束（可选）</label>
             <textarea class="input" id="m-note" placeholder="例如：先完成最小闭环，严格零 DB 迁移..."></textarea>
           </div>`,
          async () => {
            const note = document.getElementById("m-note").value.trim();
            await patchTask(taskId, {
              phase: "intake",
              dispatch: { kind: "start_backlog", mode: isInv ? "investigate" : "implement", note },
            });
            closeModal();
          },
          isInv ? "进入 Now 并调研" : "立项开工"
        );
        return;
      }

      // Quick toggle owner (me <-> team)
      const ownerBtn = e.target.closest("[data-quick-owner]");
      if (ownerBtn) {
        e.stopPropagation();
        const taskId = ownerBtn.dataset.quickOwner;
        const t = state.snapshot?.active_tasks?.find((x) => x.task_id === taskId);
        if (!t) return;
        const nextOwner = t.owner === "team" ? "me" : "team";
        const patch = { owner: nextOwner };
        if (t.phase === "backlog") patch.bucket = nextOwner === "team" ? "team" : "must";
        await patchTask(taskId, patch, `归属已切换为 ${nextOwner}`);
        return;
      }

      // Bug triage quick actions (investigate / fix)
      const bugBtn = e.target.closest("[data-bug-triage]");
      if (bugBtn) {
        e.stopPropagation();
        const mode = bugBtn.dataset.bugTriage;
        const taskId = bugBtn.dataset.task;
        const t = state.snapshot?.active_tasks?.find((x) => x.task_id === taskId);
        if (!t) return;
        openModal(
          `${mode === "investigate" ? "派只读排查" : "派修 Bug"} · ${t.title}`,
          `<div class="field">
             <label>目标</label>
             <div class="badges"><span class="badge strong">${esc(t.project_slug)}</span><span class="badge ${t.severity === "P0" ? "blocker" : ""}">${esc(t.severity || "P1")}</span></div>
           </div>
           <div class="field">
             <label>补充上下文 / 线索（可选）</label>
             <textarea class="input" id="m-note" placeholder="例如：只读排查 prod-aws 日志，不要改动线上配置..."></textarea>
           </div>`,
          async () => {
            const note = document.getElementById("m-note").value.trim();
            await patchTask(taskId, {
              phase: "in_progress",
              owner: "me",
              dispatch: { kind: "triage_bug", mode, note },
            });
            closeModal();
          },
          mode === "investigate" ? "派发只读排查" : "派发修复"
        );
        return;
      }

      // Edit dependencies inline modal
      const editDepsBtn = e.target.closest("[data-edit-deps]");
      if (editDepsBtn) {
        e.stopPropagation();
        const taskId = editDepsBtn.dataset.editDeps;
        const t = state.snapshot?.active_tasks?.find((x) => x.task_id === taskId);
        if (!t) return;
        const allIds = (state.snapshot?.active_tasks || []).map((x) => x.task_id).filter((id) => id !== taskId);
        openModal(
          `前置依赖 · ${taskId}`,
          `<div class="field">
             <label>依赖的 task_id（逗号分隔）</label>
             <input class="input mono" id="m-deps" value="${esc((t.depends_on || []).join(", "))}" placeholder="例如：example-core-update" />
             <div style="font-size:11px;color:var(--fg-dim);margin-top:4px">当前活跃任务参考：${esc(allIds.slice(0, 6).join(", "))}</div>
           </div>`,
          async () => {
            const raw = document.getElementById("m-deps").value;
            const deps = raw.split(",").map((x) => x.trim()).filter(Boolean);
            await patchTask(taskId, { depends_on: deps }, "已更新前置依赖");
            closeModal();
          },
          "保存依赖"
        );
        return;
      }

      // Edit next_step / note modal
      const editNoteBtn = e.target.closest("[data-edit-note]");
      if (editNoteBtn) {
        e.stopPropagation();
        const taskId = editNoteBtn.dataset.editNote;
        const t = state.snapshot?.active_tasks?.find((x) => x.task_id === taskId);
        if (!t) return;
        openModal(
          `编辑说明 · ${taskId}`,
          `<div class="field">
             <label>Next Step / 备注</label>
             <textarea class="input" id="m-next" style="min-height:110px">${esc(t.next_step || "")}</textarea>
           </div>`,
          async () => {
            await patchTask(taskId, { next_step: document.getElementById("m-next").value.trim() }, "已保存说明");
            closeModal();
          },
          "保存"
        );
        return;
      }

      // Release train completion (double confirmation modal)
      const completeRelBtn = e.target.closest("[data-complete-release]");
      if (completeRelBtn) {
        e.stopPropagation();
        const relId = completeRelBtn.dataset.completeRelease;
        const r = state.snapshot?.active_tasks?.find((x) => x.task_id === relId);
        if (!r) return;
        const inc = r.included_tasks || [];
        const unchecked = (r.checklist || []).filter((c) => !c.done).length;
        openModal(
          `确认发版完成并批量归档 · ${r.title}`,
          `<div class="field">
             <label>高影响确认</label>
             <div style="font-size:12.5px;color:var(--fg-secondary);line-height:1.55">
               此操作将把车次 <span class="mono">${esc(relId)}</span> 及其包含的 <strong>${esc(inc.length)}</strong> 个 <span class="mono">merged_pending_release</span> 任务一键归档至 <span class="mono">tasks/archive/</span>。
               ${unchecked > 0 ? `<div style="color:var(--sig-amber);margin-top:6px">注意：当前仍有 ${esc(unchecked)} 项发版检查项未勾选。</div>` : ""}
             </div>
           </div>
           <div class="field">
             <label>发版版本号 / Tag（可选）</label>
             <input class="input mono" id="m-rel-tag" placeholder="例如：v0.9.0" />
           </div>
           <div class="field">
             <label>备注（可选）</label>
             <input class="input" id="m-rel-note" placeholder="例如：AWS SaaS Prod Helm rev 42 验证通过" />
           </div>`,
          async () => {
            const release_tag = document.getElementById("m-rel-tag").value.trim();
            const note = document.getElementById("m-rel-note").value.trim();
            const res = await apiRequest("POST", `/api/releases/${encodeURIComponent(relId)}/complete`, {
              confirm: true,
              release_tag: release_tag || undefined,
              note: note || undefined,
            });
            state.selectedTaskId = null;
            showToast("发版车次已归档", `共归档 ${res.archived_tasks?.length ?? 0} 个任务 + 车次本身`, "ok");
            closeModal();
            await refreshSnapshot();
          },
          "确认已发 Prod 并归档"
        );
        return;
      }

      // Single task archive
      const archBtn = e.target.closest("[data-archive]");
      if (archBtn) {
        e.stopPropagation();
        const taskId = archBtn.dataset.archive;
        openModal(
          `归档任务 · ${taskId}`,
          `<div class="field">
             <label>确认操作</label>
             <div style="font-size:12.5px;color:var(--fg-secondary);line-height:1.55">将任务 <span class="mono">${esc(taskId)}</span> 移入 <span class="mono">tasks/archive/</span> 并自动刷新 <span class="mono">BOARD.md / BACKLOG.md</span>。</div>
           </div>
           <div class="field">
             <label>归档原因（可选）</label>
             <input class="input" id="m-archive-reason" value="completed_via_dashboard" />
           </div>`,
          async () => {
            const reason = document.getElementById("m-archive-reason").value.trim() || "completed_via_dashboard";
            await apiRequest("POST", `/api/tasks/${encodeURIComponent(taskId)}/archive`, { reason });
            if (state.selectedTaskId === taskId) state.selectedTaskId = null;
            showToast("已归档任务", taskId, "ok");
            closeModal();
            await refreshSnapshot();
          },
          "确认归档"
        );
        return;
      }

      const checkStatusBtn = e.target.closest("[data-check-status]");
      if (checkStatusBtn) {
        e.stopPropagation();
        checkStatusBtn.disabled = true;
        const taskId = checkStatusBtn.dataset.checkStatus;
        const task = state.snapshot?.active_tasks?.find((t) => t.task_id === taskId);
        try {
          await triggerAction({ kind: "check_status", task_id: taskId, project_slug: task?.project_slug });
        } catch {
          // triggerAction reports the error.
        } finally {
          checkStatusBtn.disabled = false;
        }
        return;
      }

      // Needs Human decision buttons
      const decideBtn = e.target.closest("[data-decide]");
      if (decideBtn) {
        e.stopPropagation();
        const decision = decideBtn.dataset.decide;
        const taskId = decideBtn.dataset.task;
        const task = state.snapshot?.active_tasks?.find((t) => t.task_id === taskId);
        const pr = task?.prs?.find((p) => p.url === task.pull_request?.url);
        const labels = {
          approve_merge: "批准并合入 PR",
          approve_pr: "提交 Approve",
          request_changes: "提交 Request Changes",
          continue_round: decideBtn.textContent.trim(),
          custom: "发送自定义指示",
        };
        openModal(
          `${labels[decision] || decision} · ${taskId}`,
          `<div class="field">
             <label>补充说明 / 指示（${decision === "custom" ? "必填" : "可选"}）</label>
             <textarea class="input" id="m-note" placeholder="输入给 Orchestrator 的指示..."></textarea>
           </div>`,
          async () => {
            const note = document.getElementById("m-note").value.trim();
            if (decision === "custom" && !note) { showToast("请输入指令内容", "", "warn"); return; }
            await triggerAction({
              kind: "decision", task_id: taskId, project_slug: task?.project_slug,
              pr_number: pr?.number, pr_url: pr?.url, decision, note,
            });
            closeModal();
          },
          "确认并触发"
        );
        return;
      }

      if (e.target.closest("[data-stop], a, button, select, input, label")) return;

      const openTask = e.target.closest("[data-open-task]");
      if (openTask) {
        state.selectedTaskId = openTask.dataset.openTask;
        state.selectedReceiptIdx = 0;
        render();
        return;
      }
    });

    // Keyboard open for focused task rows
    document.addEventListener("keydown", (e) => {
      if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-open-task]")) {
        e.preventDefault();
        state.selectedTaskId = e.target.dataset.openTask;
        state.selectedReceiptIdx = 0;
        render();
      }
    });

    document.getElementById("project-filter").addEventListener("change", (e) => { state.project = e.target.value; render(); });
    document.getElementById("search-input").addEventListener("input", (e) => { state.query = e.target.value; render(); });
    document.getElementById("drawer-close").addEventListener("click", () => { state.selectedTaskId = null; render(); });
    document.getElementById("drawer-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "drawer-backdrop") { state.selectedTaskId = null; render(); }
    });
    document.getElementById("modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "modal-backdrop") closeModal();
    });
    document.getElementById("modal-close").addEventListener("click", closeModal);
    document.getElementById("modal-cancel").addEventListener("click", closeModal);

    async function runModalSubmit() {
      if (!state.modalSubmitFn) return;
      const btn = document.getElementById("modal-submit");
      if (btn.disabled) return;
      btn.disabled = true;
      try {
        await state.modalSubmitFn();
      } catch (err) {
        showToast("操作失败", err?.message || String(err), "err");
      } finally {
        btn.disabled = false;
      }
    }
    document.getElementById("modal-submit").addEventListener("click", runModalSubmit);

    async function submitThreadMessage(steer = false) {
      const inp = document.getElementById("drawer-thread-input");
      const text = inp.value.trim();
      if (!text || !state.selectedTaskId) return;
      inp.disabled = true;
      try {
        const res = await apiRequest("POST", `/api/tasks/${encodeURIComponent(state.selectedTaskId)}/thread`, {
          body: text,
          steer,
        });
        inp.value = "";
        if (steer) reportWebhookResult(res, "已发送到 Orchestrator");
        else showToast("已写入 Thread 备注", "", "ok");
        await refreshSnapshot();
        const bodyEl = document.getElementById("drawer-body");
        if (bodyEl) bodyEl.scrollTop = bodyEl.scrollHeight;
      } catch (err) {
        showToast("发送失败", err.message, "err");
      } finally {
        inp.disabled = false;
        inp.focus();
      }
    }

    document.getElementById("drawer-comment-btn").addEventListener("click", () => submitThreadMessage(false));
    document.getElementById("drawer-steer-btn").addEventListener("click", () => submitThreadMessage(true));
    document.getElementById("drawer-thread-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        submitThreadMessage(true);
      } else if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        submitThreadMessage(false);
      }
    });

    document.getElementById("btn-theme").addEventListener("click", () => {
      const html = document.documentElement;
      const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
      html.setAttribute("data-theme", next);
      localStorage.setItem("zstack-theme", next);
      updateThemeIcon();
    });
    const savedTheme = localStorage.getItem("zstack-theme");
    if (savedTheme === "light" || savedTheme === "dark") {
      document.documentElement.setAttribute("data-theme", savedTheme);
    }
    updateThemeIcon();

    document.addEventListener("keydown", (e) => {
      const modalOpen = document.getElementById("modal-backdrop").classList.contains("open");
      if (e.key === "Escape") {
        closeCreateMenu();
        if (modalOpen) closeModal();
        else if (state.selectedTaskId) { state.selectedTaskId = null; render(); }
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && modalOpen && state.modalSubmitFn) {
        e.preventDefault();
        runModalSubmit();
        return;
      }
      if (e.key === "/" && !modalOpen && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "")) {
        e.preventDefault();
        document.getElementById("search-input").focus();
      }
    });

    function connectSse() {
      const es = new EventSource("/api/events");
      es.addEventListener("snapshot", (ev) => {
        try {
          state.snapshot = JSON.parse(ev.data);
          state.sseState = "live";
          render();
        } catch {}
      });
      es.onerror = () => {
        state.sseState = "reconnecting";
        updateStatusBadge();
      };
    }

    refreshSnapshot();
    connectSse();
  </script>
</body>
</html>
