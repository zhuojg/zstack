schema_version: 1
slug: "<project-slug>"
display_name: "<Display Name>"
owner: "<your-github-handle>"
policy_version: "2026-11-23"
last_verified_at: "2026-11-23"

t3:
  project_id: "<t3-project-uuid>"
  environment_id: "<t3-environment-uuid>"
  workspace_root_ref: "/abs/path/to/product/repo" # Metadata reference only; Orchestrator MUST NOT read/write this path

repository:
  canonical: "github.com/<owner>/<repo>"
  default_branch: "origin/main"
  trusted_remotes:
    origin:
      url: "git@github.com:<owner>/<repo>.git"
      role: "primary_pr"
      allow_push_branches: true
      allow_push_default: false

capabilities:
  implement:
    allowed: true
    requires_worktree: true
    default_provider: "codex"
    default_model: "gpt-6.2-sol"
  review:
    allowed: true
    independent_thread_required: true
    must_pin_head_sha: true
    max_rounds: 3
    default_provider: "claudeAgent"
    default_model: "claude-opus-5-5"
  merge:
    policy: "auto_merge_on_gate_pass" # auto_merge_on_gate_pass | human_approval_required
    requires_independent_review_pass_on_head_sha: true
  deploy:
    policy: "forbidden_by_default"

environments:
  local:
    access: "read_write_in_worktree"

repo_sop_refs:
  repo_agents_md: "AGENTS.md"

zstack_sops: []
